name: audit-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          pip install safetensors
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Procedure check
        run: python audit/procedure_check.py
      - name: Self-test
        run: python audit/selftest.py
      - name: Report gate (structure and citations)
        run: python audit/report_check.py --cites
